services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: krada, POSTGRES_USER: krada, POSTGRES_PASSWORD: krada}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U krada], interval: 3s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck: {test: [CMD, redis-cli, ping], interval: 3s, timeout: 3s, retries: 20}
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment: {RABBITMQ_DEFAULT_USER: krada, RABBITMQ_DEFAULT_PASS: krada}
    ports: ["15672:15672"]
    healthcheck: {test: [CMD, rabbitmq-diagnostics, -q, ping], interval: 5s, timeout: 5s, retries: 20}
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: krada, MINIO_ROOT_PASSWORD: krada-local-secret}
    volumes: [minio_data:/data]
  backend:
    build: ./backend
    env_file: .env
    environment: {DATABASE_URL: postgresql+psycopg://krada:krada@postgres:5432/krada}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment: {VITE_API_URL: http://localhost:8000/api/v1}
    ports: ["5173:5173"]
    depends_on: [backend]
volumes: {postgres_data: {}, minio_data: {}}
